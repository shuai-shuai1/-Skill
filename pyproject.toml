[project]
name = "research-paper-skill"
version = "0.2.0"
description = "Evidence-driven research paper writing and reproducible scientific figure skill"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "Pillow>=10.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/shuai-shuai1/research-paper-skill"
Issues = "https://github.com/shuai-shuai1/research-paper-skill/issues"
Changelog = "https://github.com/shuai-shuai1/research-paper-skill/blob/main/CHANGELOG.md"

[tool.unittest]
start-directory = "tests"
